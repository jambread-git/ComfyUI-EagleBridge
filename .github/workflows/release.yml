name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - RELEASE.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("RELEASE.json", encoding="utf-8"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release ZIP
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="ComfyUI-EagleBridge-v$VERSION.zip"
          git archive --format=zip --prefix="ComfyUI-EagleBridge/" -o "$ZIP" HEAD
          echo "Created $ZIP"

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ZIP="ComfyUI-EagleBridge-v$VERSION.zip"
          gh release create "$TAG" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "ComfyUI-EagleBridge v$VERSION" \
            --generate-notes \
            --latest
